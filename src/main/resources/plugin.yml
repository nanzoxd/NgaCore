name: SMPCore
softdepend: [WorldGuard]
version: '${project.version}'
main: me.smpcore.SMPCore
api-version: '1.21'
description: All-in-one SMP rules plugin with a GUI for every feature.
commands:
  smp:
    description: Open the settings menu or run an admin sub-command.
    usage: /smp [reload|itemban|help]
    aliases: [smpcore, smpsettings]
    permission: smpcore.admin
  ban:
    description: Ban a player. Replaces the vanilla /ban.
    usage: /ban <player> <duration> [reason]
    permission: smpcore.tempban
  unban:
    description: Unban a player.
    usage: /unban <player>
    permission: smpcore.tempban
  pardon:
    description: Unban a player. Replaces the vanilla /pardon.
    usage: /pardon <player>
    permission: smpcore.tempban
  spawn:
    description: Teleport to spawn.
    permission: smpcore.spawn
  setspawn:
    description: Set the spawn where you stand.
    permission: smpcore.admin
  warp:
    description: Teleport to a warp.
    usage: /warp <name>
    permission: smpcore.warp
  warps:
    description: List the warps.
    permission: smpcore.warp
  setwarp:
    description: Create a warp where you stand.
    usage: /setwarp <name>
    permission: smpcore.admin
  delwarp:
    description: Delete a warp.
    usage: /delwarp <name>
    permission: smpcore.admin
  vanish:
    description: Hide from everyone (tab list, chat completion, server list).
    usage: /vanish [player]
    aliases: [v]
    permission: smpcore.vanish
  freeze:
    description: Freeze or unfreeze a player.
    usage: /freeze <player>
    permission: smpcore.freeze
  invsee:
    description: Look into a player's inventory.
    usage: /invsee <player>
    permission: smpcore.invsee
  endersee:
    description: Look into a player's ender chest.
    usage: /endersee <player>
    permission: smpcore.invsee
  tempban:
    description: Temporary bans with a GUI and custom messages.
    usage: /tempban <ban|unban|list|history|gui>
    aliases: [tban]
    permission: smpcore.tempban
  settings:
    description: Open the settings menu (same as /smp).
    usage: /settings
    permission: smpcore.admin
  punish:
    description: Open the punish menu (ban, mute, kick, warn).
    usage: /punish <player>
    permission: smpcore.tempban
  pvp:
    description: Toggle your own PvP.
    usage: /pvp
  msg:
    description: Send a private message.
    usage: /msg <player> <message>
    aliases: [tell, w, whisper, pm]
  reply:
    description: Reply to your last private message.
    usage: /reply <message>
    aliases: [r]
  announce:
    description: Animated title, chat line and sounds for everyone.
    usage: /announce <message>
    aliases: [ann]
    permission: smpcore.announce
  broadcast:
    description: Chat-only message for everyone (no title).
    usage: /broadcast <message>
    aliases: [bc, bcast]
    permission: smpcore.broadcast
permissions:
  smpcore.announce:
    description: Use /announce.
    default: op
  smpcore.broadcast:
    description: Use /broadcast.
    default: op
  smpcore.vanish:
    description: Use /vanish.
    default: op
  smpcore.vanish.see:
    description: See vanished players.
    default: op
  smpcore.freeze:
    description: Use /freeze and get frozen-player alerts.
    default: op
  smpcore.freeze.bypass:
    description: Can't be frozen.
    default: op
  smpcore.invsee:
    description: Use /invsee and /endersee (view only).
    default: op
  smpcore.invsee.modify:
    description: Take and move items in /invsee and /endersee.
    default: op
  smpcore.randomtp.bypass:
    description: Not sent to a random spot on first join.
    default: false
  smpcore.spawn:
    description: Use /spawn.
    default: true
  smpcore.warp:
    description: Use /warp and /warps.
    default: true
  smpcore.spawn.bypass:
    description: No wait before teleporting to spawn or a warp.
    default: false
  smpcore.admin:
    description: Settings GUI and admin commands.
    default: op
  smpcore.tempban:
    description: TempBan commands and GUI.
    default: op
  smpcore.bypass.damage:
    default: false
  smpcore.bypass.cooldown:
    default: false
  smpcore.bypass.itemban:
    default: false
  smpcore.bypass.potion:
    default: false
  smpcore.bypass.enchant:
    default: false
  smpcore.bypass.dimension:
    default: false
  smpcore.bypass.deathban:
    default: false
  smpcore.bypass.xaero:
    description: Never restricted by the Xaero minimap fair play / disable switches.
    default: false
  smpcore.chat.bypass:
    description: Skip cooldown, duplicate, word, caps and link filters.
    default: false
  smpcore.bypass.combat:
    description: Never combat tagged, no command blocking, no logout penalty, safe zones don't stop you.
    default: false
  smpcore.bypass.tweaks:
    description: Skip block placing/breaking and vault rules.
    default: false
  smpcore.maintenance.bypass:
    description: Join while maintenance mode is on.
    default: op
